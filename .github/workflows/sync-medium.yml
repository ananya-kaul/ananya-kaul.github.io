name: Sync Medium articles

# Checks the Medium feed once a day and commits any new posts into
# src/app/lib/writing.ts, then kicks off a deploy so the site picks them up.
# Run it by hand any time from the Actions tab ("Run workflow").
#
# It also makes one read from Supabase each run, so the free project behind
# the recommendations and the contact form is never idle long enough to pause.
#
# GitHub switches off scheduled workflows in a public repository after 60 days
# without a commit. Most days there is no new article, so nothing is committed
# and the clock keeps running — the last step re-enables this workflow through
# the API on every run, which resets that clock without touching the history.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write # to commit the updated article list
  actions: write # to trigger the deploy workflow and keep this one enabled

concurrency:
  group: "sync-medium"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Pull new articles from Medium
        run: node scripts/sync-medium.mjs

      - name: Commit and deploy if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/app/lib/writing.ts; then
            echo "No new articles — nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/lib/writing.ts
          git commit -m "Add new Medium article(s) [skip ci]"
          git push

          # A push made with GITHUB_TOKEN does not trigger other workflows,
          # so ask the deploy workflow to run explicitly.
          gh workflow run deploy.yml --ref main
          echo "Committed new articles and triggered a deploy."

      # Supabase pauses a free project after about a week without database
      # activity, and a quiet portfolio easily goes that long — it paused once
      # already and took the recommendations wall and both forms down with it.
      # One small public read a day keeps it awake. A failure here turns the
      # run red, which is the early warning that the project is paused again.
      - name: Keep the Supabase project from pausing
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase secrets are not set, so the project cannot be kept awake."
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 10 -o /dev/null \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/public_recommendations?select=id&limit=1" \
            || { echo "::error::Supabase did not answer. The project may be paused: restore it from the dashboard."; exit 1; }
          echo "Supabase answered — the project stays active."

      # Runs even when Medium is down, because a few bad days in a row are
      # exactly when the 60-day clock would otherwise run out.
      - name: Keep this workflow from being disabled for inactivity
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/sync-medium.yml/enable"
          echo "Re-enabled sync-medium.yml — the inactivity clock is reset."
